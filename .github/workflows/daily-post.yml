name: daily-post

on:
  workflow_dispatch:
    inputs:
      note:
        description: "이번 회차에만 줄 추가 지시 (예: SOXL 관련 주제로 써줘)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      BLOG_ID: ${{ vars.BLOG_ID || '7402902975921367375' }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'draft' }}
      GH_TOKEN: ${{ github.token }}
      TOPIC_LABEL: ${{ github.event.inputs.note }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
          npm install -g @anthropic-ai/claude-code > /dev/null

      - name: Collect existing posts
        run: |
          mkdir -p work/graphics
          python scripts/blogger.py list > work/existing_posts.json
          echo "기존 글 $(python -c "import json;print(len(json.load(open('work/existing_posts.json'))))")개"

      - name: Research and write (Claude)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NOTE: ${{ github.event.inputs.note }}
          MODEL: ${{ vars.CLAUDE_MODEL || 'opus' }}
        run: |
          set -o pipefail
          TODAY=$(date +%F)
          PROMPT="$(cat prompts/daily.md)

          오늘 날짜(서울): ${TODAY}
          이번 회차 추가 지시: ${NOTE:-없음}"
          claude -p "$PROMPT" \
            --model "$MODEL" \
            --max-turns 120 \
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(python scripts/render.py*),Bash(python scripts/check.py*),Bash(ls*)" \
            --output-format text 2>&1 | tee work/claude_log.txt || true
          if grep -qiE "hit your (session|usage|weekly)? ?limit|usage limit|rate limit" work/claude_log.txt; then
            echo "::error title=Claude 사용 한도 초과::$(grep -iE 'limit' work/claude_log.txt | head -1) — 한도가 풀린 뒤 이 실행을 Re-run 하세요."
            exit 1
          fi
          if grep -qiE "invalid api key|authentication|unauthorized|OAuth token" work/claude_log.txt; then
            echo "::error title=Claude 인증 실패::CLAUDE_CODE_OAUTH_TOKEN 비밀값을 확인하세요. (claude setup-token 으로 다시 발급)"
            exit 1
          fi
          if [ ! -f work/post.json ]; then
            echo "::error title=글 작성 미완료::Claude가 글을 끝내지 못했어요. Artifacts의 work/claude_log.txt 를 확인하세요."
            tail -20 work/claude_log.txt
            exit 1
          fi

      - name: Render graphics
        run: python scripts/render.py

      - name: Check output (fix once if needed)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ vars.CLAUDE_MODEL || 'opus' }}
        run: |
          if python scripts/check.py; then exit 0; fi
          echo "::warning::검사 실패 → Claude가 오류만 한 번 고쳐요"
          ERR=$(python -c "import json;print(chr(10).join(json.load(open('work/check.json'))['errors']))" 2>/dev/null || echo "work/post.json 또는 body.html 을 다시 확인")
          claude -p "work/ 에 있는 블로그 글이 자동 검사에서 떨어졌어. prompts/daily.md 규칙(말투·금지사항)을 지키면서 아래 오류만 고쳐. 그래픽(work/graphics/gN.html)을 고쳤으면 python scripts/render.py 를 다시 실행하고, 마지막에 python scripts/check.py 로 통과를 확인해.
          오류:
          ${ERR}" \
            --model "$MODEL" --max-turns 30 \
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,Bash(python scripts/render.py*),Bash(python scripts/check.py*),Bash(ls*)" \
            --output-format text 2>&1 | tee work/fix_log.txt || true
          python scripts/render.py
          python scripts/check.py

      - name: Fact review (separate model)
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'sonnet' }}
        run: |
          claude -p "$(cat prompts/review.md)" \
            --model "$REVIEW_MODEL" --max-turns 30 \
            --allowedTools "Read,Write,Glob,WebFetch,WebSearch" \
            --output-format text 2>&1 | tee work/review_log.txt || true
          python -c "import json;d=json.load(open('work/review.json'));print('검토 점수:', d.get('scores'))"

      - name: Upload images and save to Blogger
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          python scripts/publish.py

      - name: Keep work files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-${{ github.run_id }}
          path: work/
          retention-days: 14

      - name: Notify failure
        if: failure()
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          WHY=$( (grep -h "::error\|오류:" work/*.txt 2>/dev/null; tail -n 8 work/claude_log.txt 2>/dev/null) | tail -n 12)
          printf '%s\n\n%s\n\n```\n%s\n```\n\n%s\n' \
            "**${{ github.workflow }}** 실행이 실패했어요. 블로그에는 아무것도 저장되지 않았을 수 있어요." \
            "주제: ${TOPIC_LABEL:-자동}" "${WHY:-(로그 없음)}" \
            "실행 기록: ${RUN} — 원인을 고친 뒤(사용 한도면 풀린 뒤) 이 링크에서 **Re-run** 하세요." > /tmp/fail.md
          gh issue create --title "⚠️ [$(date +%F)] 자동글쓰기 실패 — ${{ github.workflow }}" --body-file /tmp/fail.md
