name: queue-runner

on:
  workflow_run:
    workflows: [post-now]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  next:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/queue_next.py
