name: post-now

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "쓸 주제 (예: SOXL 보수와 변동성 위험 정리)"
        required: true
      publish:
        description: "바로 발행할까요? (끄면 임시저장만)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      BLOG_ID: ${{ vars.BLOG_ID || '7402902975921367375' }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      PUBLISH_MODE: ${{ github.event.inputs.publish == 'true' && 'now' || 'draft' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
          npm install -g @anthropic-ai/claude-code > /dev/null

      - name: Collect existing posts
        run: |
          mkdir -p work/graphics
          python scripts/blogger.py list > work/existing_posts.json
          echo "기존 글 $(python -c "import json;print(len(json.load(open('work/existing_posts.json'))))")개"

      - name: Research and write (Claude)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NOTE: "사용자가 고른 주제예요. 1단계 트렌드 조사와 주제 선정은 건너뛰고 이 주제로 써(기존 글과 같은 주제라도 각도를 달리해서 써): ${{ github.event.inputs.topic }}"
          MODEL: ${{ vars.CLAUDE_MODEL || 'opus' }}
        run: |
          TODAY=$(date +%F)
          PROMPT="$(cat prompts/daily.md)

          오늘 날짜(서울): ${TODAY}
          이번 회차 추가 지시: ${NOTE:-없음}"
          claude -p "$PROMPT" \
            --model "$MODEL" \
            --max-turns 120 \
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(python scripts/render.py*),Bash(python scripts/check.py*),Bash(ls*)" \
            --output-format text | tee work/claude_log.txt

      - name: Render graphics
        run: python scripts/render.py

      - name: Check output
        run: python scripts/check.py

      - name: Upload images and save to Blogger
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          python scripts/publish.py

      - name: Keep work files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-${{ github.run_id }}
          path: work/
          retention-days: 14
