name: backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance
      - run: python scripts/backtest.py
      - name: Save result
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add data/backtest_tqqq.json
          git commit -m "backtest result $(date +%F)" || exit 0
          git push
